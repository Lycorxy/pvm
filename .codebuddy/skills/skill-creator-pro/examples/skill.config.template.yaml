# Skill 配置模板（v3）
# 将此文件复制到 skill-name/skill.config.yaml（每个 skill 一份）
# 完整契约规范见 references/contract-pattern.md

# ── 触发与优先级 ──
priority: 80
auto-trigger: true
trigger-keywords:
    - keyword1
    - keyword2
    - keyword3

# ── 依赖关系 ──
# 🔒 depends-on 必须包含 specflow-rules-engine（规则注入引擎）
depends-on:
    - specflow-rules-engine
mutual-exclude: []
require-tools: [read_file]

# ── 生命周期 ──
load-strategy: lazy
unload-after-run: true
max-duration: 120

# ── 触发权重 ──
trigger-weight:
    keyword1: 90
    keyword2: 80
    keyword3: 50

# ── MCP 能力声明（编排器探测用，skill 不直接读取）──
# 声明本 skill 期望可用的 MCP 服务器，编排器据此构建能力清单
# 无 MCP 环境时，skill 通过 step-contracts.providers 降级链兜底
mcp-capabilities:
    - server: "knowledge-base"          # 知识库 MCP
      optional: true                    # true=有则用，无则降级
    - server: "memory-store"            # 记忆 MCP
      optional: true

# ── 数据契约（step-contracts）──
# 每个 Step 声明它需要的知识/上下文/记忆数据
# providers 优先级链：MCP 存在时必调用，不存在时降级
# 详见 references/contract-pattern.md
step-contracts:
    - id: example-knowledge             # 契约唯一标识（kebab-case）
      step: "1.1"                       # 对应 SKILL.md 步骤号
      name: "获取领域知识"               # 人类可读名称
      criticality: preferred            # required | preferred | optional
      input:                            # 契约输入（skill 已有数据）
          context_key: "上下文值"
      output:                           # 契约输出（注入给 skill 的数据）
          knowledge_data: "知识内容"
          source_label: "数据来源标签"
      providers:                        # 提供者优先级链（从上到下尝试）
          - mcp:                        # 优先级 1：MCP（存在时必调用）
              server: "knowledge-base"
              tool: "query"
              params:                   # 可用 {input.xxx} 引用契约输入
                  domain: "{input.context_key}"
          - builtin:                    # 优先级 2：内置工具降级
              strategy: "read_file"
              description: "读取本地 references 兜底"
          - fallback: "ask-user"        # 优先级 3：最终降级
      on-missing: degrade               # block | degrade | ask
      degrade-source: "references/fallback.md"  # degrade 时的本地兜底文件

    - id: example-runtime-data
      step: "1.2"
      name: "获取运行时上下文数据"
      criticality: required             # 硬依赖：缺则阻断
      input:
          target: "分析目标"
      output:
          result_set: "结果集"
          confidence: "置信度"
      providers:
          - mcp:
              server: "knowledge-base"
              tool: "analyze"
              params:
                  target: "{input.target}"
          - builtin:
              strategy: "search_content + code-explorer"
          - fallback: "ask-user"
      on-missing: block                 # 硬依赖：无法获取则阻断

# ── 记忆钩子（可选）──
# 在 skill 执行的关键节点，由编排器调用 MCP 存储记忆/会话
# skill 正文不感知这些钩子，仅在此声明
memory-hooks:
    on-step-complete:
        - event: "key-decision-made"
          mcp-store:
              server: "memory-store"
              tool: "save_memory"
    on-skill-end:
        - event: "session-summary"
          mcp-store:
              server: "memory-store"
              tool: "save_session"
