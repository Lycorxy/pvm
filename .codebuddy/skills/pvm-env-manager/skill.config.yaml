    端口冲突: 75

# ── MCP 能力声明（编排器探测用，skill 不直接读取）──
mcp-capabilities: []

# ── 数据契约（step-contracts）──
# 本 skill 无 MCP 需求：环境数据由 scripts/detect-env.ps1/.sh 本地获取
step-contracts: []

# ── 记忆钩子（可选）──
memory-hooks: {}
