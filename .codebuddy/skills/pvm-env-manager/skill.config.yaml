# PVM 环境管理 Skill 配置
# 未装 PVM → 检测环境安装匹配版本；已装 → 直接执行 pvm 命令

# ── 触发与优先级 ──
priority: 90
auto-trigger: true
trigger-keywords:
    # 安装 PVM
    - pvm
    - 安装pvm
    - 帮我安装pvm
    - 自动安装pvm
    - mac安装pvm
    - linux安装pvm
    - windows安装pvm
    - install pvm
    # pvm 命令
    - pvm use
    - pvm install
    - pvm命令
    - pvm更新
    - pvm卸载
    # 环境 / 版本问题（先调用本 skill）
    - 环境问题
    - 环境诊断
    - 诊断环境
    - 环境隔离
    - 需要python环境
    - 需要node环境
    - 需要运行时
    - 切换版本
    - 版本管理器
    - 多语言版本
    - node版本
    - python版本
    - 运行时版本
    - 版本冲突
    # 迁移
    - 卸载nvm
    - 清理nvm
    - 迁移到pvm
    # pnpm / lockfile
    - pnpm版本
    - 锁定pnpm
    - pnpm依赖冲突
    - lockfile
    - lock文件冲突
    - lockfile冲突
    - 锁文件冲突
    - 锁死版本
    - 锁版本
    - version lock
    - npmrc配置
    - 配置npmrc
    # 权限 / 占用错误
    - EPERM
    - ERR_PNPM_EPERM
    - EACCES
    - pnpm权限
    - pnpm报错
    - pnpm安装失败
    - esbuild占用
    - operation not permitted
    - unlink
    - 端口冲突

# ── 依赖关系 ──
# GateLoop harness 模式：规则由 anchor.config.json 的 reads 内联，无外部 skill 依赖
depends-on: []
mutual-exclude: []
require-tools: [read_file, execute_command, search_content]

# ── 生命周期 ──
load-strategy: lazy
unload-after-run: true
max-duration: 300

# ── 触发权重 ──
trigger-weight:
    安装pvm: 95
    帮我安装pvm: 98
    自动安装pvm: 98
    mac安装pvm: 96
    linux安装pvm: 96
    windows安装pvm: 96
    install pvm: 95
    pvm use: 92
    pvm install: 92
    pvm命令: 92
    pvm更新: 90
    pvm卸载: 90
    环境问题: 85
    需要python环境: 85
    需要node环境: 85
    node版本: 82
    python版本: 82
    运行时版本: 82
    版本冲突: 82
    卸载nvm: 88
    环境诊断: 85
    诊断环境: 85
    环境隔离: 80
    切换版本: 78
    版本管理器: 65
    多语言版本: 60
    锁定pnpm: 82
    pnpm依赖冲突: 80
    lock文件冲突: 90
    lockfile冲突: 90
    锁文件冲突: 90
    锁死版本: 88
    锁版本: 88
    version lock: 88
    npmrc配置: 80
    配置npmrc: 80
    EPERM: 92
    ERR_PNPM_EPERM: 95
    EACCES: 90
    pnpm权限: 90
    pnpm报错: 85
    pnpm安装失败: 88
    esbuild占用: 85
    operation not permitted: 92
