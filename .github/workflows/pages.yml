# pvm 文档站自动部署：push master → 构建 dockit → GitHub Pages + Gitee Pages 分支
#
# GitHub Pages：自动部署（需仓库 Settings → Pages → Source 选 "GitHub Actions"）
# Gitee Pages：产物推到 Gitee 仓库 gh-pages 分支；免费版无自动部署 API，
#   首次在 Gitee 网页（服务 → Gitee Pages）选 gh-pages 分支开启，
#   之后每次推送后在该页面点击「更新」（Gitee 平台限制）。
#
# 前置：仓库 Secret GITEE_TOKEN（release-init.ps1 会自动配置）。

name: Deploy Docs

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Build docs (dockit)
        working-directory: dockit
        run: |
          pnpm install --frozen-lockfile
          pnpm run build     # 产物输出到仓库根的 docs/

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: Upload docs artifact (for Gitee)
        uses: actions/upload-artifact@v4
        with:
          name: docs-site
          path: docs

  deploy-github-pages:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  # 推构建产物到 Gitee 仓库 gh-pages 分支（Gitee Pages 从该分支读取）
  deploy-gitee-branch:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: docs-site
          path: docs-site

      - name: Push to Gitee gh-pages
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
        run: |
          if [ -z "${GITEE_TOKEN:-}" ]; then
            echo "GITEE_TOKEN 未配置，跳过 Gitee 分支同步"
            exit 0
          fi
          cd docs-site
          git init -q
          git config user.name "pvm-release-bot"
          git config user.email "noreply@pvm.local"
          git checkout -q -b gh-pages
          git add -A
          git commit -q -m "docs: deploy from master"
          # token 只出现在本次进程环境与远端 URL 中，不写入仓库配置
          git push -q --force "https://pvm-bot:${GITEE_TOKEN}@gitee.com/lycorxy/pvm.git" gh-pages:gh-pages
          echo "gh-pages 已推送到 Gitee（Gitee Pages 网页点击「更新」生效）"
