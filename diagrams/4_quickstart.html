<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1200, initial-scale=1">
<title>PVM 上手指南</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{
  background:#f8fafc;
  padding:60px;
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;
}
.wrap{
  max-width:1000px;
  margin:0 auto;
}
.title{
  text-align:center;
  font-size:26px;
  font-weight:800;
  color:#0f172a;
  margin-bottom:8px;
}
.subtitle{
  text-align:center;
  font-size:15px;
  color:#64748b;
  margin-bottom:50px;
}

/* flow */
.flow{display:flex;align-items:flex-start;justify-content:center;gap:0}

.step{
  width:190px;
  display:flex;flex-direction:column;align-items:center;
  text-align:center;
}
.step .circle{
  width:76px;height:76px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  font-size:32px;
  margin-bottom:16px;
  box-shadow:0 4px 16px rgba(0,0,0,.06);
}
.step h4{font-size:17px;font-weight:700;color:#0f172a;margin-bottom:8px}
.step p{font-size:13px;color:#64748b;line-height:1.6}
.step code{
  background:#f1f5f9;padding:3px 8px;border-radius:5px;
  font-family:'SF Mono',Consolas,monospace;font-size:12px;color:#334155;
  white-space:nowrap;
}
.step .auto{
  font-size:11px;color:#94a3b8;margin-top:4px;
}

.step:nth-child(1) .circle{background:linear-gradient(135deg,#dbeafe,#bfdbfe);color:#1e40af}
.step:nth-child(3) .circle{background:linear-gradient(135deg,#ede9fe,#ddd6fe);color:#5b21b6}
.step:nth-child(5) .circle{background:linear-gradient(135deg,#d1fae5,#a7f3d0);color:#065f46}

/* arrow separator */
.arr{
  width:80px;display:flex;align-items:center;
  justify-content:center;padding-top:26px;
}
.arr .line{
  width:100%;height:3px;background:#e2e8f0;border-radius:2px;position:relative;
}
.arr .line::after{
  content:'';position:absolute;right:-2px;top:-5px;
  width:0;height:0;
  border-left:10px solid #cbd5e1;
  border-top:6px solid transparent;
  border-bottom:6px solid transparent;
}

/* bottom note */
.note{
  margin-top:50px;text-align:center;
  background:#fff;border:1px solid #e2e8f0;border-radius:14px;
  padding:24px 32px;box-shadow:0 1px 3px rgba(0,0,0,.03);
}
.note p{font-size:14px;color:#475569;line-height:1.8}
.note p em{font-weight:700;color:#10b981;font-style:normal}
</style>
</head>
<body>
<div class="wrap">

  <div class="title">PVM 上手指南</div>
  <div class="subtitle">装一个工具，管所有运行时 —— 三步走完</div>

  <div class="flow">
    <div class="step">
      <div class="circle">📦</div>
      <h4>安装 PVM</h4>
      <p>下载后双击安装<br/><span class="auto">setup 自动运行</span><br/>一分钟完成</p>
    </div>

    <div class="arr"><div class="line"></div></div>

    <div class="step">
      <div class="circle">🔒</div>
      <h4>锁定版本</h4>
      <p><code>pvm use node@20</code><br/><code>pvm use python@3.12</code><br/>安装 + 配置一步到位</p>
    </div>

    <div class="arr"><div class="line"></div></div>

    <div class="step">
      <div class="circle">✅</div>
      <h4>提交 · 完事</h4>
      <p><code>git add .pvmrc</code><br/>同事 cd 进来<br/>版本自动就位<br/>无需任何额外配置</p>
    </div>
  </div>

  <div class="note">
    <p>
      不需要手动 setup &nbsp;·&nbsp; 不需要配环境变量 &nbsp;·&nbsp; 不需要在 README 里写"请确保你装了以下..."<br>
      <em>装一个 PVM，就够了。</em>
    </p>
  </div>

</div>
</body>
</html>
